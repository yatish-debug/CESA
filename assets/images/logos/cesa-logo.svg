<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Warm institutional gradients -->
    <linearGradient id="cesaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#805A10"/>
    </linearGradient>
    <linearGradient id="cesaMaroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A52A2A"/>
      <stop offset="50%" stop-color="#7B1E28"/>
      <stop offset="100%" stop-color="#55111B"/>
    </linearGradient>
    <linearGradient id="cesaBeigeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F2EBE0"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#5A3E28" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Outer Ring with warm shadow -->
  <circle cx="150" cy="150" r="140" fill="url(#cesaBeigeBg)" stroke="url(#cesaGold)" stroke-width="4" filter="url(#subtleShadow)"/>
  <circle cx="150" cy="150" r="130" fill="none" stroke="url(#cesaMaroon)" stroke-width="2" stroke-dasharray="4 2"/>
  
  <!-- Outer Banner Ribbon ring -->
  <circle cx="150" cy="150" r="115" fill="#FAF6EE" stroke="url(#cesaGold)" stroke-width="2"/>

  <!-- Curved Text Path -->
  <path id="textPathTop" d="M 40,150 A 110,110 0 0,1 260,150" fill="none"/>
  <path id="textPathBottom" d="M 260,150 A 110,110 0 0,1 40,150" fill="none"/>

  <text font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#7B1E28" letter-spacing="2.5">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      COMPUTER ENGINEERING STUDENT ASSOCIATION
    </textPath>
  </text>
  
  <text font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#7B1E28" letter-spacing="3.5">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      ★ GCOE JALGAON ★
    </textPath>
  </text>

  <!-- Center Crest Inner Circle -->
  <circle cx="150" cy="150" r="82" fill="url(#cesaMaroon)" stroke="url(#cesaGold)" stroke-width="3"/>
  <circle cx="150" cy="150" r="77" fill="none" stroke="#FAF6EE" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Central Graphic: Microchip / Core with Laurel Leaves -->
  <!-- Laurel Wreath base -->
  <path d="M 95,155 C 95,190 120,210 150,210 C 180,210 205,190 205,155" fill="none" stroke="url(#cesaGold)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Microchip Base -->
  <rect x="122" y="105" width="56" height="56" rx="8" fill="#FAF6EE" stroke="url(#cesaGold)" stroke-width="2.5"/>
  <rect x="130" y="113" width="40" height="40" rx="4" fill="#7B1E28"/>
  
  <!-- Chip Pins Top & Bottom -->
  <line x1="133" y1="100" x2="133" y2="105" stroke="url(#cesaGold)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="144" y1="100" x2="144" y2="105" stroke="url(#cesaGold)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="156" y1="100" x2="156" y2="105" stroke="url(#cesaGold)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="167" y1="100" x2="167" y2="105" stroke="url(#cesaGold)" stroke-width="2.5" stroke-linecap="round"/>

  <line x1="133" y1="161" x2="133" y2="166" stroke="url(#cesaGold)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="144" y1="161" x2="144" y2="166" stroke="url(#cesaGold)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="156" y1="161" x2="156" y2="166" stroke="url(#cesaGold)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="167" y1="161" x2="167" y2="166" stroke="url(#cesaGold)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Chip Pins Left & Right -->
  <line x1="117" y1="116" x2="122" y2="116" stroke="url(#cesaGold)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="117" y1="127" x2="122" y2="127" stroke="url(#cesaGold)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="117" y1="138" x2="122" y2="138" stroke="url(#cesaGold)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="117" y1="149" x2="122" y2="149" stroke="url(#cesaGold)" stroke-width="2.5" stroke-linecap="round"/>

  <line x1="178" y1="116" x2="183" y2="116" stroke="url(#cesaGold)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="178" y1="127" x2="183" y2="127" stroke="url(#cesaGold)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="178" y1="138" x2="183" y2="138" stroke="url(#cesaGold)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="178" y1="149" x2="183" y2="149" stroke="url(#cesaGold)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Code Symbol inside chip: < / > -->
  <path d="M 142,127 L 136,133 L 142,139" fill="none" stroke="url(#cesaGold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 158,127 L 164,133 L 158,139" fill="none" stroke="url(#cesaGold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="152" y1="125" x2="148" y2="141" stroke="#FAF6EE" stroke-width="2" stroke-linecap="round"/>

  <!-- CESA Bold Acronym -->
  <text x="150" y="190" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="900" fill="#FAF6EE" text-anchor="middle" letter-spacing="4">
    CESA
  </text>
  <text x="150" y="202" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="7.5" font-weight="700" fill="url(#cesaGold)" text-anchor="middle" letter-spacing="2">
    ESTD • COMP DEPT
  </text>
</svg>
