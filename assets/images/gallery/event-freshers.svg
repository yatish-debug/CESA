<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="frBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6"/>
      <stop offset="100%" stop-color="#EAE3D4"/>
    </linearGradient>
    <linearGradient id="frGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#frBg)"/>
  
  <rect x="100" y="70" width="600" height="360" rx="20" fill="#FFFFFF" stroke="#E2DACD" stroke-width="2"/>

  <!-- Welcome banner, confetti, and graduation hats / microphones -->
  <g transform="translate(200, 100)">
    <!-- Welcome Arch Ribbon -->
    <path d="M 50,70 Q 200,20 350,70 L 340,95 Q 200,45 60,95 Z" fill="#8A282B"/>
    <text x="200" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
      WELCOME FRESHERS
    </text>

    <!-- Confetti Dots in warm festive colors -->
    <circle cx="80" cy="130" r="6" fill="#C59B27"/>
    <circle cx="120" cy="110" r="5" fill="#8A282B"/>
    <circle cx="160" cy="140" r="7" fill="#E5C158"/>
    <circle cx="240" cy="120" r="6" fill="#8A282B"/>
    <circle cx="280" cy="145" r="5" fill="#C59B27"/>
    <circle cx="320" cy="115" r="7" fill="#6F5844"/>

    <!-- Happy Students Silhouette Icon Group -->
    <g transform="translate(130, 130)">
      <!-- Student 1 -->
      <circle cx="40" cy="30" r="16" fill="#E8DEC8"/>
      <path d="M 20,70 C 20,50 60,50 60,70 Z" fill="#8A282B"/>
      <!-- Student 2 (Center) -->
      <circle cx="75" cy="20" r="18" fill="#DFD4C4"/>
      <path d="M 52,68 C 52,45 98,45 98,68 Z" fill="#C59B27"/>
      <!-- Student 3 -->
      <circle cx="110" cy="30" r="16" fill="#E8DEC8"/>
      <path d="M 90,70 C 90,50 130,50 130,70 Z" fill="#8A282B"/>
    </g>
  </g>

  <!-- Title Bottom Banner -->
  <text x="400" y="365" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#2C2724" text-anchor="middle">
    CESA Fresher's Welcome & Induction Meet
  </text>
  <text x="400" y="392" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#786B60" text-anchor="middle">
    Orientation, Fun Challenges & Grand Student Association Welcome
  </text>
</svg>
