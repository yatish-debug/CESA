<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="eBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6"/>
      <stop offset="100%" stop-color="#EAE3D4"/>
    </linearGradient>
    <linearGradient id="eGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#eBg)"/>
  
  <rect x="100" y="70" width="600" height="360" rx="20" fill="#FFFFFF" stroke="#E2DACD" stroke-width="2"/>

  <!-- Compass, Gears, Blueprint, T-Square of Engineers' Day -->
  <g transform="translate(260, 110)">
    <!-- Blueprint grid -->
    <rect x="0" y="20" width="280" height="170" rx="8" fill="#F4EFE6" stroke="#8A282B" stroke-width="2"/>
    <line x1="20" y1="60" x2="260" y2="60" stroke="#DFD4C4" stroke-width="1.5"/>
    <line x1="20" y1="100" x2="260" y2="100" stroke="#DFD4C4" stroke-width="1.5"/>
    <line x1="20" y1="140" x2="260" y2="140" stroke="#DFD4C4" stroke-width="1.5"/>
    <line x1="70" y1="20" x2="70" y2="190" stroke="#DFD4C4" stroke-width="1.5"/>
    <line x1="140" y1="20" x2="140" y2="190" stroke="#DFD4C4" stroke-width="1.5"/>
    <line x1="210" y1="20" x2="210" y2="190" stroke="#DFD4C4" stroke-width="1.5"/>

    <!-- Large Gear -->
    <circle cx="140" cy="105" r="48" fill="none" stroke="url(#eGold)" stroke-width="10"/>
    <circle cx="140" cy="105" r="22" fill="#8A282B"/>
    <circle cx="140" cy="105" r="8" fill="#F4EFE6"/>

    <!-- Compass / Divider -->
    <path d="M 140,50 L 95,150" stroke="#5E4E3E" stroke-width="4" stroke-linecap="round"/>
    <path d="M 140,50 L 185,150" stroke="#5E4E3E" stroke-width="4" stroke-linecap="round"/>
    <circle cx="140" cy="50" r="7" fill="url(#eGold)"/>
  </g>

  <!-- Title Bottom Banner -->
  <text x="400" y="365" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#2C2724" text-anchor="middle">
    Engineers' Day & Project Exhibition
  </text>
  <text x="400" y="392" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#786B60" text-anchor="middle">
    Tribute to Sir M. Visvesvaraya • Innovative Hardware & Software Projects
  </text>
</svg>
