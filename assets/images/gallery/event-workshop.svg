<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#EAE3D5"/>
    </linearGradient>
    <linearGradient id="wGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#9C7716"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#wBg)"/>
  
  <rect x="100" y="70" width="600" height="360" rx="20" fill="#FFFFFF" stroke="#E2DACD" stroke-width="2"/>
  
  <!-- Presentation Screen / Whiteboard -->
  <rect x="180" y="110" width="300" height="180" rx="10" fill="#FAF7F2" stroke="#8A282B" stroke-width="3"/>
  <rect x="180" y="110" width="300" height="32" rx="10" fill="#8A282B"/>
  <text x="330" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    Full-Stack & Cloud Architecture Masterclass
  </text>
  
  <!-- Cloud & Server diagram on screen -->
  <circle cx="270" cy="200" r="26" fill="#EDE4D5" stroke="#C59B27" stroke-width="2"/>
  <text x="270" y="205" font-family="monospace" font-size="11" font-weight="700" fill="#8A282B" text-anchor="middle">API</text>
  <rect x="340" y="175" width="85" height="50" rx="6" fill="#F4EDE2" stroke="#8A282B" stroke-width="2"/>
  <text x="382" y="197" font-family="monospace" font-size="10" font-weight="700" fill="#2C2724" text-anchor="middle">CLOUD</text>
  <text x="382" y="212" font-family="monospace" font-size="9" fill="#7A6855" text-anchor="middle">SERVER</text>
  <line x1="296" y1="200" x2="340" y2="200" stroke="#C59B27" stroke-width="3" stroke-dasharray="4 2"/>
  
  <!-- Screen Stand -->
  <line x1="330" y1="290" x2="330" y2="330" stroke="#7A6855" stroke-width="6"/>
  <line x1="290" y1="330" x2="370" y2="330" stroke="#7A6855" stroke-width="6" stroke-linecap="round"/>

  <!-- Speaker Podium -->
  <g transform="translate(530, 160)">
    <polygon points="20,40 70,40 60,160 30,160" fill="#8A282B"/>
    <rect x="10" y="25" width="70" height="16" rx="4" fill="#C59B27"/>
    <!-- Microphone -->
    <path d="M 45,25 Q 40,0 55,5" fill="none" stroke="#2C2724" stroke-width="2.5"/>
    <circle cx="55" cy="5" r="4" fill="#8A282B"/>
    <!-- Speaker Avatar icon -->
    <circle cx="45" cy="-25" r="16" fill="#DFD6C9"/>
    <path d="M 25,18 C 25,-2 65,-2 65,18" fill="#8A282B"/>
  </g>

  <!-- Title Bottom Banner -->
  <text x="400" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#2C2724" text-anchor="middle">
    Hands-On Technical Workshop
  </text>
  <text x="400" y="405" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#786B60" text-anchor="middle">
    Alumni & Industry Expert Mentorship Series • CESA GCOEJ
  </text>
</svg>
