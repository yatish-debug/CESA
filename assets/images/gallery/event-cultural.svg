<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6"/>
      <stop offset="100%" stop-color="#EBE3D3"/>
    </linearGradient>
    <linearGradient id="cMaroon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A282B"/>
      <stop offset="100%" stop-color="#A5383C"/>
    </linearGradient>
    <linearGradient id="cGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#E5C158"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#cBg)"/>
  
  <rect x="100" y="70" width="600" height="360" rx="20" fill="#FFFFFF" stroke="#E2DACD" stroke-width="2"/>
  
  <!-- Stage & Curtains in elegant maroon and gold -->
  <!-- Left Curtain drape -->
  <path d="M 120,90 Q 200,90 200,220 Q 150,220 120,290 Z" fill="url(#cMaroon)" opacity="0.9"/>
  <!-- Right Curtain drape -->
  <path d="M 680,90 Q 600,90 600,220 Q 650,220 680,290 Z" fill="url(#cMaroon)" opacity="0.9"/>
  <!-- Top Toran / Festoon banner -->
  <path d="M 120,90 Q 260,130 400,90 Q 540,130 680,90 L 680,105 Q 540,145 400,105 Q 260,145 120,105 Z" fill="url(#cGold)"/>

  <!-- Traditional Musical Elements / Diya & Dholak / Stage Light -->
  <!-- Spotlight Glow -->
  <polygon points="400,95 240,310 560,310" fill="#FFF9E6" opacity="0.4"/>

  <!-- Traditional Tabla / Instruments -->
  <g transform="translate(330, 210)">
    <!-- Dayan -->
    <ellipse cx="45" cy="50" rx="22" ry="12" fill="#E8DEC8" stroke="#6F5844" stroke-width="2"/>
    <ellipse cx="45" cy="50" rx="10" ry="5" fill="#3D3227"/>
    <path d="M 23,50 L 28,88 Q 45,95 62,88 L 67,50" fill="#8A282B" stroke="#6F5844" stroke-width="2"/>
    <!-- Bayan -->
    <ellipse cx="95" cy="52" rx="26" ry="14" fill="#E8DEC8" stroke="#6F5844" stroke-width="2"/>
    <ellipse cx="90" cy="51" rx="12" ry="6" fill="#3D3227"/>
    <path d="M 69,52 L 72,88 Q 95,96 118,88 L 121,52" fill="#755E45" stroke="#6F5844" stroke-width="2"/>
  </g>

  <!-- Traditional Brass Diya of Wisdom -->
  <g transform="translate(250, 220)">
    <path d="M 0,55 Q 20,40 40,55 Q 20,70 0,55 Z" fill="url(#cGold)"/>
    <!-- Flame -->
    <path d="M 0,55 Q -6,40 0,30 Q 6,40 0,55 Z" fill="#E85D04"/>
    <path d="M 0,52 Q -3,42 0,35 Q 3,42 0,52 Z" fill="#FFBA08"/>
    <rect x="18" y="65" width="4" height="20" fill="url(#cGold)"/>
    <ellipse cx="20" cy="85" rx="16" ry="6" fill="url(#cGold)"/>
  </g>

  <!-- Traditional Brass Diya Right -->
  <g transform="translate(510, 220)">
    <path d="M 40,55 Q 20,40 0,55 Q 20,70 40,55 Z" fill="url(#cGold)"/>
    <path d="M 40,55 Q 46,40 40,30 Q 34,40 40,55 Z" fill="#E85D04"/>
    <path d="M 40,52 Q 43,42 40,35 Q 37,42 40,52 Z" fill="#FFBA08"/>
    <rect x="18" y="65" width="4" height="20" fill="url(#cGold)"/>
    <ellipse cx="20" cy="85" rx="16" ry="6" fill="url(#cGold)"/>
  </g>

  <!-- Stage Plinth -->
  <rect x="140" y="300" width="520" height="20" rx="4" fill="#D6CBBF"/>

  <!-- Title Bottom Banner -->
  <text x="400" y="375" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#2C2724" text-anchor="middle">
    CESA Annual Cultural Fest & Gathering
  </text>
  <text x="400" y="400" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#786B60" text-anchor="middle">
    Traditional Day, Musical Evenings & Talent Celebration • GCOEJ
  </text>
</svg>
